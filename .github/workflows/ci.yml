name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3.1.1
        with:
          apps: scalafmt
      - run: scalafmt --check

  scala-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - name: Read Scala versions
        id: read
        # Single source of truth shared with build.sbt — see project/scala*-versions.txt.
        run: |
          versions=$(grep -hvE '^[[:space:]]*(#|$)' project/scala2-versions.txt project/scala3-versions.txt | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: scala-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ${{ fromJson(needs.scala-versions.outputs.versions) }}
    name: Test on Scala ${{ matrix.scala }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: "temurin:17.0.15"
          apps: sbt
      - name: Make `sbt` run in the foreground (sbt 2 thin client starts a background server)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/sbt-foreground"; mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"; echo "$dir" >> "$GITHUB_PATH"
      - name: Run tests
        # sbt 2.0 makes the bare `test` task incremental/cached; `testFull` forces a real run.
        run: sbt "++${{ matrix.scala }}; tests/testFull"
